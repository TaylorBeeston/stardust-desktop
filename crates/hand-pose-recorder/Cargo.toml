[package]
name = "hand-pose-recorder"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hand-pose-recorder"
path = "src/main.rs"

[dependencies]
glam = { version = "0.33.7", features = ["mint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "5"

stardust-xr-fusion = "0.53.0-rc.1"
stardust-xr-protocol = "0.53.0-rc.1"
gluon-ipc = "0.1.1"
stardust-xr-molecules = "0.53.0-rc.1"
