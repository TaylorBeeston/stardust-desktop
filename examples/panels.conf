# ~/.config/stardust-desktop/panels.conf  (read by stardust_panel_shell)
# app_id              density  fixed_res  curve_r  curve_yaw  wire
# Example: 2560x1600 laptop panel + 3440x1440 ultrawide, WayVR-sized, on a 0.70 m cylinder with
# the 5.5 cm gap straight ahead. Labels come from STARDUST_MIRROR_OUTPUTS (lowercased).
host-mirror-edp-1     2300     2560x1600  0.70     -47.80     1
host-mirror-meta-0    2070     3440x1440  0.70     70.27      0
# Flat instead of curved: put - in curve_r
